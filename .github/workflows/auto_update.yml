name: Automation Veille Mensuelle Feedly

on:
  schedule:
    # S'exécute automatiquement le 1er de chaque mois à 00:00 UTC
    - cron: '0 0 1 * *'
  workflow_dispatch: # Permet de lancer le robot manuellement pour tester

jobs:
  update-feed:
    runs-on: ubuntu-latest
    steps:
      - name: Récupération du code
        uses: actions/checkout@v4

      - name: Configuration de Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Installation des dépendances
        run: pip install feedparser

      - name: Exécution du script Feedly
        run: python update_feed.py

      - name: Sauvegarde et Push des modifications sur GitHub
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add articles.json
          git commit -m "Auto-update : Ajout des 2 articles mensuels Feedly" || exit 0
          git push
